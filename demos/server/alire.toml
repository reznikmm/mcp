name = "mcp_demo"
description = "MCP stdio echo server using generated Ada types"
version = "0.1.0-dev"
licenses = "Apache-2.0 WITH LLVM-exception"
executables = ["mcp_demo"]

[build-switches]
"*".Ada_Version = "Ada2022"
development.style_checks = ["-gnaty", "-gnaty-B"]

[build-profiles]
mcp = "development"

[[depends-on]]
mcp = "*"

[[pins]]
mcp = { path = "../.." }

[[actions]]
type = "test"
command = ["python3", "test_demo.py"]
